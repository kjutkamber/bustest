<!DOCTYPE html>
<html lang="sr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000"><title>Kad dolazi autobus</title>
<style>
:root{--bg:#000;--fg:#fff;--mut:#9aa0a6;--row:#111;--line:#2a2a2a;--amber:#ffb000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.3 "Helvetica Neue",Helvetica,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
select,input,button{background:var(--row);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit}
button{cursor:pointer}input{flex:1;min-width:0}.bar{display:flex;gap:8px;margin-bottom:8px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px;border-bottom:3px solid var(--fg);margin-bottom:6px;gap:8px}
h1{font-size:24px;margin:0}small,.mut{color:var(--mut)}
.card{border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer}
.card h2{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between}.card h2 span{color:var(--mut);font-weight:400;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:8px 0}
.bullet{flex:none;min-width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;padding:0 8px;color:#fff}
.dest{flex:1;min-width:0}.dest b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eta{text-align:right;color:var(--amber);font-weight:700;font-size:26px;line-height:1}.eta small{display:block;font-size:12px;font-weight:400;margin-top:3px}
.big .bullet{min-width:52px;height:52px;border-radius:26px;font-size:22px}.big .eta{font-size:34px}.big .row{padding:14px 0;border-bottom:1px solid var(--line)}
.msg{color:var(--mut);padding:24px 0;text-align:center}.err{color:#ff6b6b}
.res{background:var(--row);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;max-height:240px;overflow:auto}
.res div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.map{position:relative;margin-top:14px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto;background:#f3efe6}.map svg text{font-family:Helvetica,Arial,sans-serif}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}.zoom button{padding:6px 12px;background:#fff;color:#000}
</style></head><body><div class="wrap">

<section id="home"><header><h1>Moje stanice</h1><button id="plus">＋ Dodaj</button></header><div id="cards"></div></section>

<section id="add" hidden><header><h1>Dodaj stanicu</h1><button class="back">✕</button></header>
<div class="bar"><select id="city"></select><input id="q" placeholder="Ime ili broj stanice…" autocomplete="off"><button id="geo">📍</button></div>
<div id="res" class="res" hidden></div><div class="mut" style="font-size:14px">Ili dodirni stanicu na mapi:</div><div class="map"><svg id="amap" viewBox="0 0 640 440"></svg><div class="zoom"><button data-z="0.6">＋</button><button data-z="1.6">－</button></div></div></section>

<section id="detail" hidden><header><button class="back">←</button><h1 id="dname" style="flex:1"></h1><button id="del">🗑</button></header>
<div id="dlist" class="big"></div><div class="map"><svg id="dmap" viewBox="0 0 640 440"></svg><div class="zoom"><button data-z="0.6">＋</button><button data-z="1.6">－</button></div></div><p class="mut" style="font-size:12px">Mapa prikazuje stanice i trenutne pozicije vozila (ne i trasu linije).</p></section>
</div>
<script>
const API='https://nycbus.stevan-gajinov5.workers.dev'; // za telefon/GitHub Pages: ovde stavi adresu Workera, npr. 'https://bus.ime.workers.dev'
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS=['#0039a6','#ff6319','#6cbe45','#b933ad','#ee352e','#00933c','#00add0','#996633','#6d6e71'];
const color=n=>{let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))%997;return COLORS[h%COLORS.length]};
const fmt=s=>s<60?'sad':Math.round(s/60)+' min';
const api=async p=>{const r=await fetch(API+p);const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j};
const ST={};const stations=async c=>ST[c]||(ST[c]=await api('/api/stations?city='+c));
let favs=[];try{favs=JSON.parse(localStorage.favs||'[]')}catch{}
const save=()=>localStorage.favs=JSON.stringify(favs);
let cur=null,timer,mult=1,mapState={},bodies=[];

function go(v,f){
  cur=f||null;mult=1;clearInterval(timer);
  ['home','add','detail'].forEach(x=>$(x).hidden=x!=v);
  if(v=='home'){buildHome();timer=setInterval(refreshHome,15000)}
  if(v=='detail'){$('dname').textContent=f.name;refreshDetail();timer=setInterval(refreshDetail,15000)}
  if(v=='add')startAdd();
}
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>go('home'));
$('plus').onclick=()=>go('add');
$('del').onclick=()=>{if(confirm('Ukloni stanicu?')){favs=favs.filter(f=>!(f.city==cur.city&&f.uid==cur.uid));save();go('home')}};

function rows(el,lines,max){
  el.innerHTML='';
  if(!lines.length){el.innerHTML='<div class="msg">Nema nailazećih vozila.</div>';return}
  for(const l of lines.slice(0,max)){
    const a=l.arrivals[0],r=document.createElement('div');r.className='row';
    r.innerHTML='<div class="bullet"></div><div class="dest"><b></b><small></small></div><div class="eta"><span></span><small></small></div>';
    const b=r.querySelector('.bullet');b.textContent=l.number;b.style.background=color(l.number);
    r.querySelector('b').textContent=l.title;
    r.querySelector('.dest small').textContent=l.arrivals.length>1?'Zatim: '+l.arrivals.slice(1,3).map(x=>fmt(x.sec)).join(', '):'';
    r.querySelector('.eta span').textContent=fmt(a.sec);
    r.querySelector('.eta small').textContent=a.stops>0?a.stops+(a.stops==1?' stanica':' stanice'):'';
    el.appendChild(r);
  }
}
function buildHome(){
  const box=$('cards');box.innerHTML='';bodies=[];
  if(!favs.length){box.innerHTML='<div class="msg">Još nema stanica.<br>Pritisni „＋ Dodaj“.</div>';return}
  favs.forEach(f=>{
    const c=document.createElement('div');c.className='card';c.innerHTML='<h2><b></b><span></span></h2><div class="body mut">učitavam…</div>';
    c.querySelector('b').textContent=f.name;c.querySelector('span').textContent='#'+f.id;
    c.onclick=()=>go('detail',f);box.appendChild(c);bodies.push(c.querySelector('.body'));
  });
  refreshHome();
}
function refreshHome(){favs.forEach((f,i)=>api(`/api/arrivals?city=${f.city}&uid=${encodeURIComponent(f.uid)}`)
  .then(l=>rows(bodies[i],l,3)).catch(e=>{bodies[i].textContent='Greška: '+e.message}))}

async function refreshDetail(){
  const f=cur;if(!f)return;
  try{
    const lines=await api(`/api/arrivals?city=${f.city}&uid=${encodeURIComponent(f.uid)}`);
    rows($('dlist'),lines,20);
    const buses=lines.map(l=>({n:l.number,lat:l.arrivals[0].lat,lon:l.arrivals[0].lon})).filter(b=>b.lat);
    mapState={svg:$('dmap'),c:f,sts:await stations(f.city),buses,sel:f};drawMap();
  }catch(e){$('dlist').innerHTML='<div class="msg err"></div>';$('dlist').firstChild.textContent='Greška: '+e.message}
}

/* ---- mapa u stilu metro plana: svetla podloga, bele tačke sa crnim obodom, kružići sa brojem linije ---- */
function drawMap(){
  const {svg,c,sts,buses,sel,onPick}=mapState,W=640,H=440,K=111320,cos=Math.cos(c.lat*Math.PI/180);
  const dist=p=>Math.hypot((p.lat-c.lat)*110540,(p.lon-c.lon)*K*cos);
  let mpp=6;if(buses.length)mpp=Math.max(3,Math.max(...buses.map(dist))*1.25/(H/2));
  mpp*=mult;
  const X=p=>W/2+(p.lon-c.lon)*K*cos/mpp,Y=p=>H/2-(p.lat-c.lat)*110540/mpp;
  const vis=sts.map((s,i)=>({s,i,d:dist(s)})).filter(o=>{const x=X(o.s),y=Y(o.s);return x>0&&x<W&&y>0&&y<H}).sort((a,b)=>a.d-b.d).slice(0,70);
  let h='';
  vis.forEach((o,k)=>{const s=o.s,x=X(s),y=Y(s),isSel=sel&&s.uid==sel.uid;
    h+=`<g data-i="${o.i}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${isSel?10:5}" fill="${isSel?'#000':'#fff'}" stroke="#000" stroke-width="2.5"/>`+
       (k<28||isSel?`<text x="${x+(isSel?14:9)}" y="${y+4}" font-size="${isSel?14:11}" font-weight="${isSel?700:400}" paint-order="stroke" stroke="#f3efe6" stroke-width="3">${esc(s.name)}</text>`:'')+'</g>'});
  buses.forEach(b=>{const x=X(b),y=Y(b);if(x<0||x>W||y<0||y>H)return;
    h+=`<circle cx="${x}" cy="${y}" r="13" fill="${color(b.n)}" stroke="#fff" stroke-width="2.5"/><text x="${x}" y="${y+4.5}" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">${esc(b.n)}</text>`});
  svg.innerHTML=h;
  svg.onclick=e=>{const g=e.target.closest('[data-i]');if(g&&onPick)onPick(sts[g.dataset.i])};
}
document.querySelectorAll('.zoom button').forEach(b=>b.onclick=()=>{mult*=+b.dataset.z;if(mapState.svg)drawMap()});

/* ---- dodavanje stanice ---- */
function addFav(s){const city=$('city').value;
  if(!favs.some(f=>f.city==city&&f.uid==s.uid)){favs.push({city,uid:s.uid,id:s.id,name:s.name});save()}go('home')}
async function startAdd(){
  const cs=await api('/api/cities');const old=$('city').value;
  $('city').innerHTML=cs.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');if(old)$('city').value=old;
  $('q').value='';$('res').hidden=true;loadAddMap();
}
async function loadAddMap(pos){
  try{const sts=await stations($('city').value);
    const c=pos||{lat:sts.reduce((a,s)=>a+s.lat,0)/sts.length,lon:sts.reduce((a,s)=>a+s.lon,0)/sts.length};
    mapState={svg:$('amap'),c,sts,buses:[],sel:null,onPick:addFav};drawMap();
  }catch(e){$('amap').innerHTML=`<text x="20" y="40">${esc(e.message)}</text>`}
}
$('city').onchange=()=>{mult=1;loadAddMap()};
$('q').oninput=async()=>{
  const q=$('q').value.trim().toLowerCase(),box=$('res');if(!q){box.hidden=true;return}
  const sts=await stations($('city').value);
  const m=sts.filter(s=>s.name.toLowerCase().includes(q)||String(s.id).toLowerCase()==q).slice(0,30);
  box.innerHTML='';box.hidden=!m.length;
  m.forEach(s=>{const d=document.createElement('div');d.innerHTML='<b></b> <small></small>';d.firstChild.textContent=s.name;d.lastChild.textContent='#'+s.id;d.onclick=()=>addFav(s);box.appendChild(d)});
};
$('geo').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{mult=1;loadAddMap({lat:p.coords.latitude,lon:p.coords.longitude})},
  ()=>alert('Nema dozvole za lokaciju (treba https ili localhost).'));

go('home');if(!favs.length)go('add');
</script></body></html>
